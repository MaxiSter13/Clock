<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Uhr</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap" rel="stylesheet">

<style>
:root{
  --color-light:#026eff;
  --color-dark:#0141fd;
  --color-colon:#4c9afe;
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html, body{
  width:100%;
  height:100%;
  background:black;
  overflow:hidden;

  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

/* ===== UHR ===== */
#clock{
  width:100vw;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.time{
  font-family:'Fredoka', sans-serif;
  font-weight:700;
  font-size:32vw;
  line-height:1;
  white-space:nowrap;
  pointer-events:none;
  display:flex;
  align-items:baseline;
}

.time span{
  position:relative;
  display:inline-block;
  color:#1f5dff;
  text-shadow:0 0 5vw rgba(40,100,255,0.55);
}

/* Ziffern liegen eng aneinander, leichte Überlappung */
.d2{ margin-left:-0.05em; }
.d3{ margin-left:-0.02em; }
.d4{ margin-left:-0.05em; }

/* Farben: hell / dunkel / hell / dunkel */
.d1{ color:var(--color-light); }
.d2{ color:var(--color-dark); }
.d3{ color:var(--color-light); }
.d4{ color:var(--color-dark); }

/* Doppelpunkt: unsichtbarer Platzhalter gibt exakt die gleiche
   Zeilenbox wie eine Ziffer vor, damit die Punkte nicht "durchfallen" */
.colon{
  position:relative;
  display:inline-block;
  color:transparent;
}

.colon::before{
  content:"8";
  visibility:hidden;
}

.colon .dot{
  position:absolute;
  left:50%;
  width:0.22em;
  height:0.22em;
  border-radius:50%;
  background:var(--color-colon);
  transform:translate(-50%,-50%);
}

.colon .dot:first-child{ top:34%; }
.colon .dot:last-child{ top:62%; }
</style>
</head>

<body>

<div id="clock">
  <div class="time">
    <span class="d1" id="h1">0</span>
    <span class="d2" id="h2">0</span>
    <span class="colon"><span class="dot"></span><span class="dot"></span></span>
    <span class="d3" id="m1">0</span>
    <span class="d4" id="m2">0</span>
  </div>
</div>

<script>
function updateTime(){
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');

  h1.textContent = h[0];
  h2.textContent = h[1];
  m1.textContent = m[0];
  m2.textContent = m[1];
}

updateTime();
setInterval(updateTime,1000);
</script>

</body>
</html>
